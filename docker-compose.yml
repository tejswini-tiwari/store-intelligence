services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://retail:retail@db:5432/storedb
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - METRIC_WINDOW=all
      - CONVERSION_WINDOW_MINUTES=5
      # API_URL points at itself so background detection can post events back in
      - API_URL=http://localhost:8000
      - YOLO_MODEL=yolov8m.pt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # read-write: /pipeline/process saves uploads to data/inbox and detection reads clips
      - ./data:/app/data
      - ./yolov8m.pt:/app/yolov8m.pt:ro
      - ./yolov8n.pt:/app/yolov8n.pt:ro
    healthcheck:
      test: curl -f http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=retail
      - POSTGRES_PASSWORD=retail
      - POSTGRES_DB=storedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U retail -d storedb
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dashboard:
    build: .
    command: python dashboard/live.py
    environment:
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:8000
    depends_on:
      - redis
      - api
    stdin_open: true
    tty: true

  # Optional one-shot batch pass over data/cameras.json. NOT started by a plain
  # `docker compose up` (it would run once and exit). Run it explicitly with:
  #   docker compose --profile batch up pipeline
  # For interactive/live ingestion, feed clips to POST /pipeline/process instead.
  pipeline:
    build: .
    profiles: ["batch"]
    command: bash -c "cd /app && bash pipeline/run.sh || true"
    environment:
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379
      - YOLO_MODEL=yolov8m.pt
      - STAFF_HSV_LOWER=0,0,0
      - STAFF_HSV_UPPER=180,255,50
      - REENTRY_WINDOW_SECONDS=30
      - REENTRY_IOU_THRESHOLD=0.4
      - METRIC_WINDOW=all
      - CONVERSION_WINDOW_MINUTES=5
    volumes:
      - ./data/clips:/app/data/clips:ro
      - ./data/store_layout.json:/app/data/store_layout.json:ro
      - ./data/cameras.json:/app/data/cameras.json:ro
      - ./yolov8m.pt:/app/yolov8m.pt:ro
      - ./yolov8n.pt:/app/yolov8n.pt:ro
    depends_on:
      - api
    restart: "no"

volumes:
  postgres_data: